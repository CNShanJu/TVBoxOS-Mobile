plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// ------------------------------------------------------------------
// 发布配置:版本号/应用名/图标统一由 app_config.properties 维护,
// 修改该文件后重新构建即可,无需改动 build.gradle 与资源。
// ------------------------------------------------------------------
def appConfig = new Properties()
def appConfigFile = file('app_config.properties')
if (appConfigFile.exists()) {
    appConfigFile.withInputStream { ins ->
        // 跳过 UTF-8 BOM(记事本等工具保存 UTF-8 时可能带 BOM),避免污染第一个键
        ins.mark(3)
        if (ins.read() != 0xEF || ins.read() != 0xBB || ins.read() != 0xBF) {
            ins.reset()
        }
        appConfig.load(new InputStreamReader(ins, 'UTF-8'))
    }
}
def cfgVersionCode = (appConfig.getProperty('versionCode', '41') ?: '41').toInteger()
def cfgVersionName = appConfig.getProperty('versionName', '2.2.0') ?: '2.2.0'
def cfgAppName = appConfig.getProperty('appName', 'MBox') ?: 'MBox'
def cfgAppIcon = appConfig.getProperty('appIcon', '@drawable/app_icon') ?: '@drawable/app_icon'


// ------------------------------------------------------------------
// 主题颜色生成已迁移至 :ui-common 模块(3.7②):app 依赖 :ui-common 后自动获得
// 主题资源(theme_colors/theme_radii/样式/公共 drawable),app 只保留页面级资源。
// 主题 JSON 统一维护于 ui-common/src/main/assets/theme/。
// ------------------------------------------------------------------
android {
    namespace 'com.github.tvbox.osc'
    compileSdk 34

    defaultConfig {
        applicationId 'com.github.tvbox.osc'
        minSdk 24
        targetSdk 34
        versionCode cfgVersionCode
        versionName cfgVersionName
        // 应用名与图标来自 app_config.properties(集中配置)
        resValue "string", "app_name", cfgAppName
        manifestPlaceholders = [appIcon: cfgAppIcon]
        multiDexEnabled true
        //设置room的Schema的位置
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }

        ndk {
            //abiFilters "armeabi-v7a"//, ""
            abiFilters "arm64-v8a"
        }

    }

    // 执行配置
    applicationVariants.all { variant ->

        // Apk 输出配置
        variant.outputs.all { output ->
            outputFileName = cfgAppName + '_v' + variant.versionName + '_' + variant.buildType.name
            if (variant.buildType.name == buildTypes.release.getName()) {
                outputFileName += '_' + new Date().format("yyyyMMdd")
            }
            outputFileName += '.apk'
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/beans.xml']
        }
    }

    // 签名文件 TVBoxOSC.jks 被 .gitignore 忽略(*.jks),不会随代码上传到 GitHub。
    // 本地构建:文件存在,使用正式签名(与之前行为完全一致);
    // GitHub Actions 等 CI 环境:文件不存在,自动退回 debug 签名,
    // 保证 CI 打出的 APK 已签名、可直接安装(注意:CI 包与本地正式签名包签名不同,不能覆盖升级)。
    def releaseStoreFile = file('../TVBoxOSC.jks')

    signingConfigs {
        config {
            keyAlias 'TVBoxOSC'
            keyPassword 'TVBoxOSC'
            storeFile releaseStoreFile
            storePassword 'TVBoxOSC'
        }
    }

    buildTypes {
        debug {
            if (releaseStoreFile.exists()) {
                signingConfig signingConfigs.config
            } else {
                signingConfig signingConfigs.debug
            }
            // 调试包使用独立包名,可与设备上已安装的同包名应用共存(避免签名不一致需卸载旧应用)
            applicationIdSuffix ".debug"
            // 调试包应用名带 " debug" 后缀:桌面图标与首页/我的页标题一眼可辨
            // (resValue 优先级高于 res 文件,此处覆盖 defaultConfig 的 app_name)
            resValue "string", "app_name", cfgAppName + " debug"
        }

        release {
            if (releaseStoreFile.exists()) {
                signingConfig signingConfigs.config
            } else {
                signingConfig signingConfigs.debug
            }
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    api fileTree(dir: "libs", include: ['*.jar', '*.aar'])

    implementation 'com.google.android.material:material:1.9.0'

    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"
    implementation 'androidx.core:core-ktx:1.6.0'

    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'com.google.zxing:core:3.4.1'
    implementation 'androidx.appcompat:appcompat:1.3.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation files('libs/thunder.jar')
    implementation files('libs/commons-lang3-3.12.0.jar')
    implementation 'org.conscrypt:conscrypt-android:2.5.2'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.squareup.okhttp3:okhttp-dnsoverhttps:4.12.0'
    annotationProcessor 'androidx.room:room-compiler:2.3.0'
    implementation 'androidx.room:room-runtime:2.3.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.github.CymChad:BaseRecyclerViewAdapterHelper:2.9.45-androidx'
    implementation 'com.kingja.loadsir:loadsir:1.3.8'
    implementation 'com.google.code.gson:gson:2.8.7'
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'com.github.JessYanCoding:AndroidAutoSize:v1.2.1'
    implementation('com.thoughtworks.xstream:xstream:1.4.15') {
