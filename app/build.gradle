plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// ------------------------------------------------------------------
// 发布配置:版本号/应用名/图标统一由 app_config.properties 维护,
// 修改该文件后重新构建即可,无需改动 build.gradle 与资源。
// ------------------------------------------------------------------
def appConfig = new Properties()
def appConfigFile = file('app_config.properties')
if (appConfigFile.exists()) {
    appConfigFile.withInputStream { ins ->
        // 跳过 UTF-8 BOM(记事本等工具保存 UTF-8 时可能带 BOM),避免污染第一个键
        ins.mark(3)
        if (ins.read() != 0xEF || ins.read() != 0xBB || ins.read() != 0xBF) {
            ins.reset()
        }
        appConfig.load(new InputStreamReader(ins, 'UTF-8'))
    }
}
def cfgVersionCode = (appConfig.getProperty('versionCode', '41') ?: '41').toInteger()
def cfgVersionName = appConfig.getProperty('versionName', '2.2.0') ?: '2.2.0'
def cfgAppName = appConfig.getProperty('appName', 'MBox') ?: 'MBox'
def cfgAppIcon = appConfig.getProperty('appIcon', '@drawable/app_icon') ?: '@drawable/app_icon'


// ------------------------------------------------------------------
// 主题颜色生成已迁移至 :ui-common 模块(3.7②):app 依赖 :ui-common 后自动获得
// 主题资源(theme_colors/theme_radii/样式/公共 drawable),app 只保留页面级资源。
// 主题 JSON 统一维护于 ui-common/src/main/assets/theme/。
// ------------------------------------------------------------------
android {
    namespace 'com.github.tvbox.osc'
    compileSdk 34

    defaultConfig {
        applicationId 'com.github.tvbox.osc'
        minSdk 24
        targetSdk 34
        versionCode cfgVersionCode
        versionName cfgVersionName
        // 应用名与图标来自 app_config.properties(集中配置)
        resValue "string", "app_name", cfgAppName
        manifestPlaceholders = [appIcon: cfgAppIcon]
        multiDexEnabled true
        // 仅保留中文本地化,减小 APK 体积(未翻译文案自动回退到默认 values/)
        resConfigs 'zh-rCN', 'zh'

        ndk {
            //abiFilters "armeabi-v7a"//, ""
            abiFilters "arm64-v8a"
        }

    }

    // 执行配置
    applicationVariants.all { variant ->

        // Apk 输出配置
        variant.outputs.all { output ->
            outputFileName = cfgAppName + '_v' + variant.versionName + '_' + variant.buildType.name
            if (variant.buildType.name == buildTypes.release.getName()) {
                outputFileName += '_' + new Date().format("yyyyMMdd")
            }
            outputFileName += '.apk'
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/beans.xml']
        }
    }

    // ------------------------------------------------------------------
    // 签名:密钥不再入库(见 .gitignore:TVBoxOSC.jks 已移出版本控制)。
    // 读取顺序:环境变量 > keystore.properties(不入库) > 默认占位。
    // 任一密钥缺失时自动退回 debug 签名,保证本地/CI 都能出包。
    // 正式发布请在 CI/本地通过 secret 注入:
    //   KEYSTORE_FILE / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
    // ------------------------------------------------------------------
    def env = System.getenv()
    def keyStoreFile = env['KEYSTORE_FILE'] ?: ''
    def keyStorePassword = env['KEYSTORE_PASSWORD'] ?: ''
    def keyAlias = env['KEY_ALIAS'] ?: ''
    def keyPassword = env['KEY_PASSWORD'] ?: ''
    def keystoreProps = file('keystore.properties')
    if (keystoreProps.exists()) {
        def props = new Properties()
        keystoreProps.withInputStream { ins -> props.load(ins) }
        if (keyStoreFile.isEmpty()) keyStoreFile = props.getProperty('storeFile', '')
        if (keyStorePassword.isEmpty()) keyStorePassword = props.getProperty('storePassword', '')
        if (keyAlias.isEmpty()) keyAlias = props.getProperty('keyAlias', '')
        if (keyPassword.isEmpty()) keyPassword = props.getProperty('keyPassword', '')
    }
    def hasSigning = !keyStoreFile.isEmpty() && !keyStorePassword.isEmpty()
            && !keyAlias.isEmpty() && !keyPassword.isEmpty()
    def signFile = hasSigning ? file(keyStoreFile) : null
    def canSign = hasSigning && signFile != null && signFile.exists()

    signingConfigs {
        config {
            if (canSign) {
                storeFile signFile
                storePassword keyStorePassword
                keyAlias keyAlias
                keyPassword keyPassword
            }
        }
    }

    buildTypes {
        debug {
            signingConfig canSign ? signingConfigs.config : signingConfigs.debug
            // 调试包使用独立包名,可与设备上已安装的同包名应用共存(避免签名不一致需卸载旧应用)
            applicationIdSuffix ".debug"
            // 调试包应用名带 " debug" 后缀:桌面图标与首页/我的页标题一眼可辨
            // (resValue 优先级高于 res 文件,此处覆盖 defaultConfig 的 app_name)
            resValue "string", "app_name", cfgAppName + " debug"
        }

        release {
            signingConfig canSign ? signingConfigs.config : signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    api fileTree(dir: "libs", include: ['*.jar', '*.aar'])

    implementation 'com.google.android.material:material:1.9.0'

    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"
    implementation 'androidx.core:core-ktx:1.6.0'

    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'androidx.appcompat:appcompat:1.3.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation files('libs/thunder.jar')
    implementation files('libs/commons-lang3-3.12.0.jar')

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.squareup.okhttp3:okhttp-dnsoverhttps:4.12.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.github.CymChad:BaseRecyclerViewAdapterHelper:2.9.45-androidx'
    implementation 'com.kingja.loadsir:loadsir:1.3.8'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'com.github.JessYanCoding:AndroidAutoSize:v1.2.1'
    implementation('com.thoughtworks.xstream:xstream:1.4.20') {
        exclude group: 'xmlpull', module: 'xmlpull'
    }
    implementation 'org.greenrobot:eventbus:3.2.0'
    implementation 'com.orhanobut:hawk:2.0.1'

    implementation project(":player")
    implementation project(":quickjs")
    implementation project(":core-model")
    implementation project(":core-storage")
    implementation project(":log")
    implementation project(":state")
    implementation project(":player-api")
    implementation project(":core-network")
    implementation project(":ui-common")
    implementation project(":spider")
    implementation project(":download")

    // implementation 'com.tencent.bugly:crashreport_upgrade:latest.release'
    implementation 'com.owen:tv-recyclerview:3.0.0'

    implementation 'com.github.getActivity:XXPermissions:13.6'
    implementation 'org.jsoup:jsoup:1.14.1'
    implementation 'com.github.hedzr:android-file-chooser:v1.2.0-final'
    implementation 'commons-io:commons-io:2.11.0'
    implementation 'com.googlecode.juniversalchardet:juniversalchardet:1.0.3'

    //沉浸式状态栏
    implementation 'com.geyifeng.immersionbar:immersionbar:3.2.2'
    //标题栏
    implementation 'com.github.getActivity:TitleBar:10.5'
    //弹窗
    implementation 'com.github.li-xiaojun:XPopup:2.10.0'
    //工具类
    implementation 'com.blankj:utilcodex:1.31.0'
    //阴影/shape/选择器/圆角/...
    implementation 'com.github.lihangleo2:ShadowLayout:3.3.3'

    //tab标题栏
    implementation project(":TabLayout")
    implementation project(':ViewPager1Delegate')
    //TabLayout的非kt项目需要依赖这个包实现点击事件等
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    //展开收缩tv
    implementation 'com.github.MZCretin:ExpandableTextView:v1.6.1-x'
    //lottie动画(6.7.1:支持 v5.7 动画格式与 Gaussian Blur,修复 5.2.0 加载新动画的资源ID异常/GC风暴)
    implementation 'com.airbnb.android:lottie:6.7.1'
    //流式布局
    implementation 'com.hyman:flowlayout-lib:1.1.2'
    //毛玻璃底栏(BlurView: API31+ RenderEffect 硬件模糊 / 低版本 RenderScript 回退)
    implementation 'com.eightbitlab:blurview:1.6.3'
    //崩溃
    implementation project(":crash")
    //dlna投屏(已移除:com.github.devin1014.DLNA-Cast:dlna-dmc:V1.0.0 已从 JitPack 消失,功能暂用桩实现,见 _backup_dlna/)
    // Lifecycles(显式依赖,替代已废弃合并包 lifecycle-extensions:ViewModel/LiveData/协程作用域)
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
}
