plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// ------------------------------------------------------------------
// 发布配置:版本号/应用名/图标统一由 app_config.properties 维护,
// 修改该文件后重新构建即可,无需改动 build.gradle 与资源。
// ------------------------------------------------------------------
def appConfig = new Properties()
def appConfigFile = file('app_config.properties')
if (appConfigFile.exists()) {
    appConfigFile.withInputStream { ins ->
        // 跳过 UTF-8 BOM(记事本等工具保存 UTF-8 时可能带 BOM),避免污染第一个键
        ins.mark(3)
        if (ins.read() != 0xEF || ins.read() != 0xBB || ins.read() != 0xBF) {
            ins.reset()
        }
        appConfig.load(new InputStreamReader(ins, 'UTF-8'))
    }
}
def cfgVersionCode = (appConfig.getProperty('versionCode', '41') ?: '41').toInteger()
def cfgVersionName = appConfig.getProperty('versionName', '2.2.0') ?: '2.2.0'
def cfgAppName = appConfig.getProperty('appName', 'MBox') ?: 'MBox'
def cfgAppIcon = appConfig.getProperty('appIcon', '@drawable/app_icon') ?: '@drawable/app_icon'


// ------------------------------------------------------------------
// 主题颜色生成:读取 assets/theme/theme_colors.json(浅色)与 theme_colors_night.json(暗色),
// 分别生成 res/values 与 res/values-night 的颜色文件;文件不存在时用内置默认值。
// 两个文件字段一致:bg_body / bg_component / text_main / text_highlight / nav_text_normal
// ------------------------------------------------------------------
def themeColorsFile = file('src/main/assets/theme/theme_colors.json')
def themeColorsNightFile = file('src/main/assets/theme/theme_colors_night.json')
def themeRadiiFile = file('src/main/assets/theme/theme_radii.json')
def themeColorsDir = file("${buildDir}/generated/theme_colors")

// 圆角三档(受主题文件 theme/theme_radii.json 统一管控):背景档 / 抽屉弹窗档 / 卡片档
def defaultRadii = [
        radius_background: '25dp',
        radius_dialog    : '18dp',
        radius_card      : '12dp'
]

def defaultColors = [
        bg_body        : '#FFFFFF',
        bg_component   : '#F9FAFB',
        text_main      : '#050505',
        text_highlight : '#1F2937',
        nav_text_normal: '#CCCCCC',
        // 下载状态色:进行中(蓝) / 完成(绿)
        download_active: '#037AFF',
        download_done  : '#08CA2C',
        // 消息提示气泡:背景(浅色柔和灰白,避免纯白刺眼) / 文字
        bubble_bg      : '#F2F3F7',
        bubble_text    : '#1F2937',
        // 聚合页多选圆圈颜色(外环与选中内部填充圆同色,受主题文件管控)
        select_fill    : '#1F2937',
        // 直播页选中 tab 填充背景(浅色深蓝灰 / 暗色深灰,配白字)
        select_bg      : '#1F2937',
        // 下载条目左滑操作区背景(舒适红)
        swipe_red      : '#E5484D'
]
def defaultNightColors = [
        bg_body        : '#141218',
        bg_component   : '#212121',
        text_main      : '#FFFFFF',
        text_highlight : '#E5E7EB',
        nav_text_normal: '#7A7A7A',
        download_active: '#037AFF',
        download_done  : '#08CA2C',
        // 消息提示气泡:背景(深色) / 文字
        bubble_bg      : '#2E2C36',
        bubble_text    : '#FFFFFF',
        // 聚合页多选圆圈颜色(外环与选中内部填充圆同色,受主题文件管控)
        select_fill    : '#E5E7EB',
        // 直播页选中 tab 填充背景(浅色深蓝灰 / 暗色深灰,配白字)
        select_bg      : '#374151',
        // 下载条目左滑操作区背景(舒适红)
        swipe_red      : '#E5484D'
]

static def readColors(def file, def defaults) {
    def colors = new LinkedHashMap<>(defaults)
    if (file.exists()) {
        try {
            def json = new groovy.json.JsonSlurper().parse(file)
            colors.each { k, v ->
                def uv = json[k]
                if (uv instanceof String && uv.startsWith('#')) colors[k] = uv
            }
        } catch (Throwable th) {
            println "WARN: ${file.name} 解析失败,使用默认颜色: ${th.message}"
        }
    }
    return colors
}

static def readRadii(def file, def defaults) {
    def radii = new LinkedHashMap<>(defaults)
    if (file.exists()) {
        try {
            def json = new groovy.json.JsonSlurper().parse(file)
            radii.each { k, v ->
                def uv = json[k]
                if (uv instanceof String && (uv.endsWith('dp') || uv.endsWith('dip') || uv.endsWith('px'))) {
                    radii[k] = uv
                }
            }
        } catch (Throwable th) {
            println "WARN: ${file.name} 解析失败,使用默认圆角: ${th.message}"
        }
    }
    return radii
}

static def writeColorsXml(def dir, def name, def colors) {
    def valuesDir = new File(dir, name)
    valuesDir.mkdirs()
    def f = new File(valuesDir, 'theme_colors.xml')
    def sb = new StringBuilder('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n')
    colors.each { k, v -> sb.append("    <color name=\"${k}\">${v}</color>\n") }
    sb.append('</resources>\n')
    f.text = sb.toString()
}

static def writeRadiiXml(def dir, def name, def radii) {
    def valuesDir = new File(dir, name)
    valuesDir.mkdirs()
    def f = new File(valuesDir, 'theme_radii.xml')
    def sb = new StringBuilder('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n')
    radii.each { k, v -> sb.append("    <dimen name=\"${k}\">${v}</dimen>\n") }
    sb.append('</resources>\n')
    f.text = sb.toString()
}

task generateThemeColors {
    inputs.file(themeColorsFile).optional()
    inputs.file(themeColorsNightFile).optional()
    inputs.file(themeRadiiFile).optional()
    outputs.dir(themeColorsDir)
    doLast {
        writeColorsXml(themeColorsDir, 'values', readColors(themeColorsFile, defaultColors))
        writeColorsXml(themeColorsDir, 'values-night', readColors(themeColorsNightFile, defaultNightColors))
        // 圆角档位不分明暗主题,写入 values 即可
        writeRadiiXml(themeColorsDir, 'values', readRadii(themeRadiiFile, defaultRadii))
    }
}
preBuild.dependsOn generateThemeColors
android.sourceSets.main.res.srcDirs += themeColorsDir

android {
    namespace 'com.github.tvbox.osc'
    compileSdk 34

    defaultConfig {
        applicationId 'com.github.tvbox.osc'
        minSdk 24
        targetSdk 34
        versionCode cfgVersionCode
        versionName cfgVersionName
        // 应用名与图标来自 app_config.properties(集中配置)
        resValue "string", "app_name", cfgAppName
        manifestPlaceholders = [appIcon: cfgAppIcon]
        multiDexEnabled true
        //设置room的Schema的位置
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }

        ndk {
            //abiFilters "armeabi-v7a"//, ""
            abiFilters "arm64-v8a"
        }

    }

    // 执行配置
    applicationVariants.all { variant ->

        // Apk 输出配置
        variant.outputs.all { output ->
            outputFileName = cfgAppName + '_v' + variant.versionName + '_' + variant.buildType.name
            if (variant.buildType.name == buildTypes.release.getName()) {
                outputFileName += '_' + new Date().format("yyyyMMdd")
            }
            outputFileName += '.apk'
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/beans.xml']
        }
    }

    // 签名文件 TVBoxOSC.jks 被 .gitignore 忽略(*.jks),不会随代码上传到 GitHub。
    // 本地构建:文件存在,使用正式签名(与之前行为完全一致);
    // GitHub Actions 等 CI 环境:文件不存在,自动退回 debug 签名,
    // 保证 CI 打出的 APK 已签名、可直接安装(注意:CI 包与本地正式签名包签名不同,不能覆盖升级)。
    def releaseStoreFile = file('../TVBoxOSC.jks')

    signingConfigs {
        config {
            keyAlias 'TVBoxOSC'
            keyPassword 'TVBoxOSC'
            storeFile releaseStoreFile
            storePassword 'TVBoxOSC'
        }
    }

    buildTypes {
        debug {
            if (releaseStoreFile.exists()) {
                signingConfig signingConfigs.config
            } else {
                signingConfig signingConfigs.debug
            }
            // 调试包使用独立包名,可与设备上已安装的同包名应用共存(避免签名不一致需卸载旧应用)
            applicationIdSuffix ".debug"
            // 调试包应用名见 app/src/debug/res/values/strings.xml,便于在桌面区分正式版与调试版
        }

        release {
            if (releaseStoreFile.exists()) {
                signingConfig signingConfigs.config
            } else {
                signingConfig signingConfigs.debug
            }
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    buildFeatures {
        viewBinding true
    }
}

