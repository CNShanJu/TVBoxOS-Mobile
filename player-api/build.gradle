plugins {
    id 'com.android.library'
}

android {
    namespace 'com.github.tvbox.osc.player.api'
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation project(':core-model') // IJKCode 解码配置 DTO(播放契约返回值)
    implementation project(':core-storage') // PrefsDataStore(DataStore)播放偏好/播放器选择持久化
    implementation project(':log') // 配置变更业务日志(LogStore 便捷方法)
}
