plugins {
    id 'com.android.library'
}

android {
    namespace 'com.github.tvbox.osc.player.api'
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.orhanobut:hawk:2.0.1'
    implementation 'com.google.code.gson:gson:2.10.1' // hawk 传递依赖 gson,显式覆盖版本
    implementation project(':log') // 配置变更业务日志(LogStore 便捷方法)
}
