name: Build APK

# 触发方式:
#   1. push 到 main / master 分支
#   2. 推送 v 开头的 tag(如 v2.2.0)
#   3. 手动触发:GitHub 仓库页面 -> Actions -> Build APK -> Run workflow
on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

# 同一分支/PR 同时只保留一个构建,新任务自动取消旧任务
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 项目使用 AGP 8.2.2,必须 JDK 17 编译
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 校验 gradle wrapper 并缓存依赖,加速后续构建
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain --stacktrace
        # 说明:TVBoxOSC.jks 已随仓库提交,CI 使用与本地一致的正式签名,
        # 产物 APK 可覆盖升级本地正式签名安装的旧版本。
        # 安全提醒:签名库与密码(build.gradle 中硬编码)公开在仓库里,
        # 任何能访问仓库的人都能用该正式签名发包;如介意请改用 GitHub Secrets
        # 方式提供密钥,并重新生成一套签名库。

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MBox-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # 打 tag(v* 触发)时把 5 个库模块的 AAR 发布到 GitHub Packages,
      # 供其他项目通过 maven 坐标引用(坐标见 gradle/publish.gradle)。
      # 可选功能:失败不影响 APK 产物,先继续出包,发布问题另行修复
      - name: Publish Library AARs to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew publish --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
