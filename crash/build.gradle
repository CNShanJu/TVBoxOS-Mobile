plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'cat.ereza.customactivityoncrash'
    compileSdk 34
    resourcePrefix 'customactivityoncrash_'

    defaultConfig {
        minSdk 24
        targetSdk 34
    }
}

ext {
    PUBLISH_GROUP_ID = 'cat.ereza'
    PUBLISH_ARTIFACT_ID = 'customactivityoncrash'
    PUBLISH_VERSION = '2.4.0'
}


dependencies {
    api 'androidx.appcompat:appcompat:1.3.1'
}

// 发布到 GitHub Packages(坐标见 gradle/publish.gradle,crash 用上方 ext 覆盖坐标)
apply from: rootProject.file('gradle/publish.gradle')
