// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id 'com.android.application' version '8.2.2' apply false
    id 'com.android.library' version '8.2.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
}

ext {
    kotlin_version = '1.9.22'
}

allprojects {
    repositories {
        gradlePluginPortal()
        maven { url "https://maven.aliyun.com/repository/releases" }
        maven { url "https://maven.aliyun.com/repository/public" }
        maven { url "https://maven.aliyun.com/repository/google" }
        //dlna-cast中cling仓(依赖已移除,保留以备其他依赖)
        maven {
            url 'http://4thline.org/m2'
            allowInsecureProtocol true
        }
        maven { url "https://jitpack.io" }
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// ------------------------------------------------------------------
// 模块依赖方向门禁(改进.txt §六/§七):禁止基础模块反向依赖业务/UI。
// 运行:./gradlew checkModuleDependencies(后续可挂到 check/CI)。
// ------------------------------------------------------------------
def forbiddenModuleDeps = [
        ':core-utils' : [':core-storage',':core-network',':spider',':spider-api',':download',':player',':player-api',':app',':ui-common',':state',':log',':crash',':quickjs',':TabLayout',':ViewPager1Delegate'],
        ':core-model'  : [':core-storage', ':core-network', ':spider', ':spider-api', ':download', ':player', ':player-api', ':app', ':ui-common', ':state', ':log', ':crash', ':quickjs', ':TabLayout', ':ViewPager1Delegate'],
        ':spider-api'  : [':core-storage', ':core-network', ':spider', ':download', ':player', ':player-api', ':app', ':ui-common', ':state', ':log', ':crash', ':quickjs', ':TabLayout', ':ViewPager1Delegate'],
        ':core-storage': [':spider', ':spider-api', ':download', ':player', ':player-api', ':app', ':ui-common', ':state', ':crash', ':quickjs', ':TabLayout', ':ViewPager1Delegate'],
        ':core-network': [':spider', ':download', ':player', ':player-api', ':app', ':ui-common', ':state', ':crash', ':quickjs', ':TabLayout', ':ViewPager1Delegate'],
        ':download'    : [':spider', ':app', ':ui-common', ':crash', ':quickjs', ':TabLayout', ':ViewPager1Delegate'],
        ':player'      : [':app', ':ui-common', ':crash', ':quickjs', ':download', ':spider', ':spider-api', ':TabLayout', ':ViewPager1Delegate'],
        ':state'       : [':app', ':ui-common', ':download', ':spider', ':spider-api', ':core-storage'],
        ':log'         : [':app', ':ui-common', ':download', ':spider', ':spider-api', ':core-storage', ':core-network', ':player'],
        ':ui-common'   : [':app', ':download', ':spider', ':spider-api', ':core-storage', ':core-network', ':player'],
        ':quickjs'     : [':app', ':download', ':spider', ':spider-api', ':core-storage', ':core-network', ':player'],
        ':crash'       : [':app', ':download', ':spider', ':spider-api', ':core-storage', ':core-network', ':player', ':ui-common'],
]
def moduleDir = [
        ':core-model'  : 'core-model', ':core-utils' : 'core-utils', ':spider-api'   : 'spider-api', ':core-storage': 'core-storage',
        ':core-network': 'core-network', ':spider'     : 'spider',      ':download'    : 'download',
        ':player'      : 'player',    ':player-api'   : 'player-api',  ':state'       : 'state',
        ':log'         : 'log',       ':ui-common'    : 'ui-common',   ':quickjs'     : 'quickjs',
        ':crash'       : 'crash',
]

// 源码级门禁 2:app/ui 层禁止 import 下载模块内部实现(只允许 DownloadFacade/DownloadRequest 等公开面)。
// 下载内部实现包:com.github.tvbox.osc.download.internal.*;历史 app/util.Download* 实现类已全部
// 迁入该包并删除(app util 不再持有),仅保留对 internal 包的 import 拦截。
def appSourceDirs = [
        new File(rootDir, 'app/src/main/java'),
        new File(rootDir, 'app/src/test/java'),
]
def forbiddenDownloadImports = ~/import\s+com\.github\.tvbox\.osc\.download\.internal\.\w+\s*;/

tasks.register('checkModuleDependencies') {
    group = 'verification'
    description = '校验模块依赖方向 + app 验收红线(getCSP/hawk/DownloadManager.get/自建 OkHttpClient/下载内部实现)'
    doLast {
        def violations = []
        forbiddenModuleDeps.each { mod, forbidden ->
            def file = new File(rootDir, moduleDir[mod] + '/build.gradle')
            if (!file.exists()) return
            def text = file.getText('UTF-8')
            forbidden.each { dep ->
                // 仅匹配项目依赖行(忽略注释)
                def linePattern = ~/(?m)^[^#\/]*project\((['"])${dep.replace(':','\\:')}\1\)/
                if (linePattern.matcher(text).find()) {
                    violations << "${mod} 禁止依赖 ${dep}"
                }
            }
        }
        // app 源码不得直接 import 下载内部实现(UI 只依赖 DownloadFacade;java+kt 都查)
        appSourceDirs.each { dir ->
            if (!dir.exists()) return
            dir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
                if (f.name.endsWith('.java') || f.name.endsWith('.kt')) {
                    def src = f.getText('UTF-8')
                    if (forbiddenDownloadImports.matcher(src).find()) {
                        violations << "app 源码禁止 import 下载内部实现: ${f.path}"
                    }
                }
            }
        }
        // 验收红线自动化(改进.txt §六/AGENTS §六;app 层,含测试源码)
        def appRedLines = [
                'getCSP 爬虫直调'           : ~/\bgetCSP\s*\(/,
                'Hawk 裸依赖(import)'       : ~/import\s+com\.orhanobut\.hawk\./,
                'DownloadManager.get() 直调': ~/\bDownloadManager\.get\s*\(/,
                '业务自建 OkHttpClient'      : ~/\bnew\s+OkHttpClient\.Builder\s*\(/,
        ]
        appSourceDirs.each { dir ->
            if (!dir.exists()) return
            dir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
                if (!(f.name.endsWith('.java') || f.name.endsWith('.kt'))) return
                def lines = f.getText('UTF-8').readLines()
                lines.eachWithIndex { line, idx ->
                    appRedLines.each { label, pat ->
                        if (pat.matcher(line).find()) {
                            violations << "app 验收红线[${label}]: ${f.path}:${idx + 1}"
                        }
                    }
                }
            }
        }
        if (violations) {
            throw new GradleException("模块依赖方向/验收红线违规:\n  " + violations.join('\n  '))
        }
        println 'checkModuleDependencies: 模块依赖方向与验收红线校验通过'
    }
}
// 说明:各 android 子工程自带 check,如需随构建自动校验可在 CI 中显式调用本任务
