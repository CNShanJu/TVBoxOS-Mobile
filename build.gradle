// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id 'com.android.application' version '8.2.2' apply false
    id 'com.android.library' version '8.2.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
}

ext {
    kotlin_version = '1.9.22'
}

allprojects {
    repositories {
        gradlePluginPortal()
        maven { url "https://maven.aliyun.com/repository/releases" }
        maven { url "https://maven.aliyun.com/repository/public" }
        maven { url "https://maven.aliyun.com/repository/google" }
        //dlna-cast中cling仓(依赖已移除,保留以备其他依赖)
        maven {
            url 'http://4thline.org/m2'
            allowInsecureProtocol true
        }
        maven { url "https://jitpack.io" }
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// ------------------------------------------------------------------
// 模块依赖方向门禁(改进.txt §六/§七):禁止基础模块反向依赖业务/UI。
// 运行:./gradlew checkModuleDependencies(后续可挂到 check/CI)。
// ------------------------------------------------------------------
def forbiddenModuleDeps = [
        ':core-model'  : [':core-storage', ':core-network', ':spider', ':spider-api', ':download', ':player', ':player-api', ':app', ':ui-common', ':state', ':log', ':crash', ':quickjs', ':TabLayout', ':ViewPager1Delegate'],
        ':spider-api'  : [':core-storage', ':core-network', ':spider', ':download', ':player', ':player-api', ':app', ':ui-common', ':state', ':log', ':crash', ':quickjs', ':TabLayout', ':ViewPager1Delegate'],
        ':core-storage': [':spider', ':spider-api', ':download', ':player', ':player-api', ':app', ':ui-common', ':state', ':crash', ':quickjs', ':TabLayout', ':ViewPager1Delegate'],
        ':core-network': [':spider', ':download', ':player', ':player-api', ':app', ':ui-common', ':state', ':crash', ':quickjs', ':TabLayout', ':ViewPager1Delegate'],
        ':download'    : [':spider', ':app', ':ui-common', ':crash', ':quickjs', ':TabLayout', ':ViewPager1Delegate'],
        ':player'      : [':app', ':ui-common', ':crash', ':quickjs', ':download', ':spider', ':spider-api', ':TabLayout', ':ViewPager1Delegate'],
        ':state'       : [':app', ':ui-common', ':download', ':spider', ':spider-api', ':core-storage'],
        ':log'         : [':app', ':ui-common', ':download', ':spider', ':spider-api', ':core-storage', ':core-network', ':player'],
        ':ui-common'   : [':app', ':download', ':spider', ':spider-api', ':core-storage', ':core-network', ':player'],
        ':quickjs'     : [':app', ':download', ':spider', ':spider-api', ':core-storage', ':core-network', ':player'],
        ':crash'       : [':app', ':download', ':spider', ':spider-api', ':core-storage', ':core-network', ':player', ':ui-common'],
]
def moduleDir = [
        ':core-model'  : 'core-model', ':spider-api'   : 'spider-api', ':core-storage': 'core-storage',
        ':core-network': 'common',    ':spider'       : 'spider',      ':download'    : 'download',
        ':player'      : 'player',    ':player-api'   : 'player-api',  ':state'       : 'state',
        ':log'         : 'log',       ':ui-common'    : 'ui-common',   ':quickjs'     : 'quickjs',
        ':crash'       : 'crash',
]

tasks.register('checkModuleDependencies') {
    group = 'verification'
    description = '校验模块依赖方向(禁止基础模块反向依赖业务/UI,见改进.txt)'
    doLast {
        def violations = []
        forbiddenModuleDeps.each { mod, forbidden ->
            def file = new File(rootDir, moduleDir[mod] + '/build.gradle')
            if (!file.exists()) return
            def text = file.getText('UTF-8')
            forbidden.each { dep ->
                // 仅匹配项目依赖行(忽略注释);common 由 settings 映射为 :core-network
                def linePattern = ~/(?m)^[^#\/]*project\((['"])${dep.replace(':','\\:')}\1\)/
                if (linePattern.matcher(text).find() || (dep == ':core-network' && text.contains("project(':common')"))) {
                    violations << "${mod} 禁止依赖 ${dep}"
                }
            }
        }
        if (violations) {
            throw new GradleException("模块依赖方向违规:\n  " + violations.join('\n  '))
        }
        println 'checkModuleDependencies: 依赖方向校验通过'
    }
}
// 说明:各 android 子工程自带 check,如需随构建自动校验可在 CI 中显式调用本任务
