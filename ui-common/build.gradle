plugins {
    id 'com.android.library'
}

android {
    namespace 'com.github.tvbox.osc.uicommon'
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// ------------------------------------------------------------------
// 主题颜色生成(3.7② ui-common 自持主题):读取 assets/theme/theme_colors.json(浅色)与
// theme_colors_night.json(暗色),分别生成 res/values 与 res/values-night 的颜色文件;
// 文件不存在时用内置默认值。app 及业务模块依赖本模块后自动获得主题资源。
// ------------------------------------------------------------------
def themeColorsFile = file('src/main/assets/theme/theme_colors.json')
def themeColorsNightFile = file('src/main/assets/theme/theme_colors_night.json')
def themeRadiiFile = file('src/main/assets/theme/theme_radii.json')
def themeColorsDir = file("${buildDir}/generated/theme_colors")

def defaultRadii = [
        radius_background: '25dp',
        radius_dialog    : '18dp',
        radius_card      : '12dp',
        // 按钮圆角:radius_btn=常规按钮,radius_btn_large=大圆角按钮(chip/预设)
        radius_btn       : '12dp',
        radius_btn_large : '25dp'
]

def defaultColors = [
        bg_body        : '#FFFFFF',
        bg_component   : '#ECECF4',
        bg_popup       : '#ECECF4',
        // bg_float(底栏/上次观看气泡)与 bg_float_fab(直播钮/筛选钮/更新悬浮圈)是同一个"悬浮面"色:
        // 颜色与各自 _alpha 必须同值,否则同屏能看出深浅不一
        bg_float       : '#ECECF4',
        bg_float_fab   : '#ECECF4',
        text_main      : '#050505',
        text_highlight : '#1F2937',
        nav_text_normal: '#CCCCCC',
        download_active: '#037AFF',
        download_done  : '#08CA2C',
        select_fill    : '#1F2937',
        select_bg      : '#1F2937',
        swipe_red      : '#E5484D',
        // 按钮色板(浅色):主按钮=页面主黑填充+白字;次按钮=浅灰填充+深字;无背景按钮=主黑文字;选中态=主黑填充
        btn_confirm_bg : '#1F2937',
        btn_confirm_text: '#FFFFFF',
        btn_cancel_bg  : '#ECECF4',
        btn_cancel_text: '#1F2937',
        btn_plain_text : '#1F2937',
        btn_select_bg  : '#1F2937',
        btn_select_text: '#FFFFFF',
        // 无背景按钮的描边(浅色用主黑 40%;有填充的按钮看不到这条线,不影响)
        btn_stroke     : '#661F2937',
        // 全局高亮/选中色(开关、chip 选中、选中文字、进度条…):与主按钮同色,不再用蓝色
        color_highlight: '#1F2937',
        // 固定深色面(直播页/播放控制抽屉)上的强调色:这些面不随主题,浅色主题下用主题高亮色会看不见
        accent_on_dark : '#1890FF',
        // 开关:开启轨道=蓝色(两主题一致),关闭轨道=该主题主色,圆点固定白色
        switch_thumb   : '#FFFFFF',
        switch_track_on: '#1890FF',
        switch_track_off: '#1F2937',
        // 文字高亮色:选中/强调的文字(搜索结果来源、选集当前集、复制/展开、链接…)统一蓝色
        text_accent    : '#1890FF'
]
def defaultNightColors = [
        bg_body        : '#141218',
        bg_component   : '#211D28',
        bg_popup       : '#211D28',
        // 同 defaultColors:bg_float / bg_float_fab 必须同值(同一悬浮面)
        bg_float       : '#211D28',
        bg_float_fab   : '#211D28',
        text_main      : '#FFFFFF',
        text_highlight : '#E5E7EB',
        nav_text_normal: '#7A7A7A',
        download_active: '#037AFF',
        download_done  : '#08CA2C',
        select_fill    : '#E5E7EB',
        select_bg      : '#374151',
        swipe_red      : '#E5484D',
        // 按钮色板(暗色):主/次按钮都无背景,靠文字亮度区分;选中态用浅色填充+深色文字(否则选中看不出来)
        btn_confirm_bg : '#00000000',
        btn_confirm_text: '#E5E7EB',
        btn_cancel_bg  : '#00000000',
        btn_cancel_text: '#7A7A7A',
        btn_plain_text : '#E5E7EB',
        btn_select_bg  : '#E5E7EB',
        btn_select_text: '#141218',
        btn_stroke     : '#66E5E7EB',
        color_highlight: '#E5E7EB',
        accent_on_dark : '#1890FF',
        switch_thumb   : '#FFFFFF',
        switch_track_on: '#1890FF',
        switch_track_off: '#3C3C46',
        text_accent    : '#1890FF'
]

// 半透明色对应的透明度(0-100, 表示百分比): 独立字段, 与颜色值分开, 便于单独调透明度; 键为 <色名>_alpha
def defaultAlphas = [
        bg_popup_alpha     : 50,
        bg_float_alpha     : 85,
        bg_float_fab_alpha : 85
]
def defaultNightAlphas = [
        bg_popup_alpha     : 50,
        bg_float_alpha     : 80,
        bg_float_fab_alpha : 80
]

/** 读取 `<色名>_alpha` 独立透明度字段(0-100, 百分比), 返回 色名 -> 0-255 透明度 的映射 */
static def readAlphas(def file, def defaults) {
    def alphas = new LinkedHashMap<>(defaults)
    if (file.exists()) {
        try {
            def json = new groovy.json.JsonSlurper().parse(file)
            alphas.each { k, v ->
                def uv = json[k]
                if (uv instanceof Number) alphas[k] = ((Number) uv).intValue()
            }
        } catch (Throwable th) {
            println "WARN: ${file.name} 解析透明度失败: ${th.message}"
        }
    }
    def out = new LinkedHashMap()
    alphas.each { k, v ->
        int percent = Math.max(0, Math.min(100, ((Number) v).intValue())) // 0-100 百分制
        int alphaByte = Math.round(percent * 255 / 100f)                  // 换算 0-255
        out.put(k.replace('_alpha', ''), alphaByte)
    }
    return out
}

static def readColors(def file, def defaults) {
    def colors = new LinkedHashMap<>(defaults)
    if (file.exists()) {
        try {
            def json = new groovy.json.JsonSlurper().parse(file)
            colors.each { k, v ->
                def uv = json[k]
                if (uv instanceof String && uv.startsWith('#')) colors[k] = uv
            }
        } catch (Throwable th) {
            println "WARN: ${file.name} 解析失败,使用默认颜色: ${th.message}"
        }
    }
    return colors
}

static def readRadii(def file, def defaults) {
    def radii = new LinkedHashMap<>(defaults)
    if (file.exists()) {
        try {
            def json = new groovy.json.JsonSlurper().parse(file)
            radii.each { k, v ->
                def uv = json[k]
                if (uv instanceof String && (uv.endsWith('dp') || uv.endsWith('dip') || uv.endsWith('px'))) {
                    radii[k] = uv
                }
            }
        } catch (Throwable th) {
            println "WARN: ${file.name} 解析失败,使用默认圆角: ${th.message}"
        }
    }
    return radii
}

/** 写出颜色; alphas 为 色名 -> 0-255, 命中时把透明度合成到色值前面(#AARRGGBB) */
static def writeColorsXml(def dir, def name, def colors, def alphas) {
    def valuesDir = new File(dir, name)
    valuesDir.mkdirs()
    def f = new File(valuesDir, 'theme_colors.xml')
    def sb = new StringBuilder('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n')
    colors.each { k, v ->
        def a = alphas ? alphas.get(k) : null
        if (a != null) {
            String hex = ((String) v).replace('#', '')
            sb.append(String.format("    <color name=\"%s\">#%02X%s</color>\n", k, ((Number) a).intValue() & 0xFF, hex))
        } else {
            sb.append("    <color name=\"${k}\">${v}</color>\n")
        }
    }
    sb.append('</resources>\n')
    f.text = sb.toString()
}

static def writeRadiiXml(def dir, def name, def radii) {
    def valuesDir = new File(dir, name)
    valuesDir.mkdirs()
    def f = new File(valuesDir, 'theme_radii.xml')
    def sb = new StringBuilder('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n')
    radii.each { k, v -> sb.append("    <dimen name=\"${k}\">${v}</dimen>\n") }
    sb.append('</resources>\n')
    f.text = sb.toString()
}

task generateThemeColors {
    inputs.file(themeColorsFile).optional()
    inputs.file(themeColorsNightFile).optional()
    inputs.file(themeRadiiFile).optional()
    outputs.dir(themeColorsDir)
    doLast {
        def lightColors = readColors(themeColorsFile, defaultColors)
        def nightColors = readColors(themeColorsNightFile, defaultNightColors)
        writeColorsXml(themeColorsDir, 'values', lightColors, readAlphas(themeColorsFile, defaultAlphas))
        writeColorsXml(themeColorsDir, 'values-night', nightColors, readAlphas(themeColorsNightFile, defaultNightAlphas))
        writeRadiiXml(themeColorsDir, 'values', readRadii(themeRadiiFile, defaultRadii))
    }
}
preBuild.dependsOn generateThemeColors
android.sourceSets.main.res.srcDirs += themeColorsDir

dependencies {
    // 公共主题依赖最小化:仅 AndroidX AppCompat + Material(主题 parent 需要)
    implementation 'androidx.appcompat:appcompat:1.3.0'
    implementation 'com.google.android.material:material:1.9.0'
    // material 传递依赖 kotlinx-coroutines / constraintlayout / recyclerview 旧版,
    // 显式固定到与 app 一致的缓存版本(offline 可解析)
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
}
