plugins {
    id 'com.android.library'
}

android {
    namespace 'com.github.tvbox.osc.download'
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation project(':core-model')
    implementation project(':core-network')
    implementation project(':log')
    implementation project(':state')
    implementation project(':spider-api')
    implementation 'androidx.annotation:annotation:1.3.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.orhanobut:hawk:2.0.1'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'androidx.core:core:1.6.0' // NotificationCompat/FileProvider
    implementation 'org.greenrobot:eventbus:3.2.0' // DownloadEvent 广播
    implementation('com.thoughtworks.xstream:xstream:1.4.20') { // bean 注解
        exclude group: 'xmlpull', module: 'xmlpull'
    }
}
